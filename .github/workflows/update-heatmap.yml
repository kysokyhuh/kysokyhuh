
name: Update monochrome contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution heatmaps
        run: python scripts/generate_heatmap.py

      - name: Commit updated heatmaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions-light.svg assets/contributions-dark.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update monochrome contribution heatmaps"
            git push
          else
            echo "No changes to commit"
          fi
